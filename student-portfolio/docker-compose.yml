version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./task-manager-api
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - JWT_SECRET=testsecret
    depends_on:
      - mongodb

  frontend:
    build: .
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data:
