name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install Frontend Dependencies
        run: npm install
        
      - name: Install Backend Dependencies
        working-directory: ./task-manager-api
        run: npm install
        
      - name: Run Backend Tests
        working-directory: ./task-manager-api
        run: npm test
